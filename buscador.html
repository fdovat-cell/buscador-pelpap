<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador Papelería</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --panel2: #23262e;
    --border: #333744;
    --text: #e6e8ec;
    --text-dim: #9aa0ac;
    --accent: #4fb0ff;
    --accent-dim: #2c6ea3;
    --warn: #e0a63e;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header .count {
    color: var(--text-dim);
    font-size: 13px;
  }
  header .spacer { flex: 1; }
  #avisoCambios {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--warn);
  }
  #avisoCambios.activo { display: flex; }
  #btnDescargar {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #btnDescargar:hover { background: var(--accent); }
  .controls {
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 45px;
    z-index: 9;
  }
  .controls input[type=text] {
    flex: 1 1 240px;
    min-width: 200px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  .controls select {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 8px;
    border-radius: 6px;
    font-size: 13px;
    max-width: 220px;
  }
  .controls input:focus, .controls select:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  button {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { color: var(--text); border-color: var(--accent-dim); }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    padding: 8px 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 93px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  tbody tr.fila-producto {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  tbody tr.fila-producto:hover { background: var(--panel2); }
  tbody tr.fila-producto.editado { box-shadow: inset 3px 0 0 var(--warn); }
  tbody td {
    padding: 7px 10px;
    vertical-align: top;
  }
  td.codigo { font-family: var(--mono); color: var(--text-dim); white-space: nowrap; }
  td.precio { font-family: var(--mono); text-align: right; white-space: nowrap; }
  td.tipo { color: var(--text-dim); font-size: 12.5px; white-space: nowrap; }
  td.marca { white-space: nowrap; font-size: 12.5px; }
  .marca-tag {
    display: inline-block;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 10px;
    margin-right: 3px;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .fila-detalle { display: none; }
  .fila-detalle.abierta { display: table-row; }
  .fila-detalle td {
    background: var(--panel2);
    padding: 12px 16px;
  }
  .detalle-box {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .detalle-foto {
    width: 160px;
    flex-shrink: 0;
  }
  .detalle-foto img {
    width: 100%;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
  }
  .detalle-foto .sin-foto {
    width: 100%;
    aspect-ratio: 1;
    border: 1px dashed var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
  .detalle-info { flex: 1; }
  .detalle-info dl {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 6px 10px;
    margin: 0;
    font-size: 13px;
    align-items: center;
  }
  .detalle-info dt { color: var(--text-dim); }
  .detalle-info dd { margin: 0; }
  .precio-edit {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .precio-edit input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 5px;
    font-family: var(--mono);
    width: 110px;
    font-size: 13px;
  }
  .precio-edit input:focus { outline: none; border-color: var(--accent-dim); }
  .precio-edit .ok { color: var(--warn); font-size: 12px; display: none; }
  .precio-edit .ok.visible { display: inline; }
  .no-results {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  #btnPedido {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #btnPedido:hover { border-color: var(--accent-dim); }
  #btnPedido .badge {
    background: var(--accent);
    color: #0b1a24;
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .clic-agregar {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay.abierto { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 420px;
    padding: 18px;
  }
  .modal .modal-foto {
    width: 100%;
    max-width: 160px;
    margin: 0 auto 12px;
  }
  .modal .modal-foto img {
    width: 100%;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
  }
  .modal .modal-foto .sin-foto {
    width: 100%;
    aspect-ratio: 1;
    border: 1px dashed var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
  .modal h2 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  .modal .modal-desc {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin: 10px 0 4px;
  }
  .modal input[type=number], .modal input[type=text] {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  .modal .modal-botones {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    justify-content: flex-end;
  }
  .modal .btn-primario {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: #fff;
  }
  .modal .btn-primario:hover { background: var(--accent); }

  .panel-pedido {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 560px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .panel-pedido h2 {
    font-size: 15px;
    margin: 0;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-pedido-lista {
    overflow-y: auto;
    padding: 8px 18px;
    flex: 1;
  }
  .item-pedido {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .item-pedido .item-info { flex: 1; min-width: 0; }
  .item-pedido .item-codigo { font-family: var(--mono); color: var(--text-dim); font-size: 12px; }
  .item-pedido .item-desc { font-size: 13px; }
  .item-pedido .item-nota { font-size: 12px; color: var(--warn); }
  .item-pedido .item-cant {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .item-pedido .item-cant input {
    width: 48px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 13px;
    text-align: center;
  }
  .item-pedido .item-cant input:focus { outline: none; border-color: var(--accent-dim); }
  .item-pedido .item-subtotal {
    font-family: var(--mono);
    white-space: nowrap;
    text-align: right;
    min-width: 80px;
  }
  .item-pedido button.quitar {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    padding: 2px 6px;
  }
  .item-pedido button.quitar:hover { color: #e05a5a; }
  .panel-pedido-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-pedido-footer .total {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
  }
  .pedido-vacio {
    color: var(--text-dim);
    text-align: center;
    padding: 30px 0;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Buscador Papelería</h1>
  <span class="count" id="contador"></span>
  <div class="spacer"></div>
  <span id="avisoCambios">● cambios sin guardar</span>
  <button id="btnPedido">🛒 Nota de pedido <span class="badge" id="badgePedido">0</span></button>
  <button id="btnDescargar">Descargar archivo actualizado</button>
</header>

<div class="controls">
  <input type="text" id="buscar" placeholder="Buscar por código o descripción...">
  <select id="filtroTipo"><option value="">Todos los tipos</option></select>
  <select id="filtroMarca"><option value="">Todas las marcas</option></select>
  <button id="limpiar">Limpiar filtros</button>
</div>

<table>
  <thead>
    <tr>
      <th data-col="codigo">Código</th>
      <th data-col="descripcion">Descripción</th>
      <th data-col="tipo">Tipo</th>
      <th data-col="marcas">Marca</th>
      <th data-col="precio">Precio</th>
    </tr>
  </thead>
  <tbody id="cuerpoTabla"></tbody>
</table>
<div class="no-results" id="sinResultados" style="display:none;">Sin resultados para esta búsqueda.</div>

<div class="overlay" id="overlayAgregar">
  <div class="modal">
    <h2 id="modalTitulo"></h2>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="modal-foto" id="modalFoto"></div>
    <label for="modalCantidad">Cantidad</label>
    <input type="number" id="modalCantidad" min="1" step="1" value="1">
    <label for="modalNota">Nota (color, característica, etc.)</label>
    <input type="text" id="modalNota" placeholder="Ej: tinta azul">
    <div class="modal-botones">
      <button id="modalCancelar">Cancelar</button>
      <button class="btn-primario" id="modalAgregar">Agregar al pedido</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayPedido">
  <div class="panel-pedido">
    <h2>Nota de pedido</h2>
    <div class="panel-pedido-lista" id="listaPedido"></div>
    <div class="panel-pedido-footer">
      <span class="total" id="totalPedido">Total: $ 0,00</span>
      <button id="btnVaciarPedido">Vaciar</button>
      <button class="btn-primario" id="btnDescargarPedido">Descargar</button>
      <button id="btnCerrarPedido">Cerrar</button>
    </div>
  </div>
</div>

<script>
const PRODUCTOS = JSON.parse(document.getElementById('datos-productos').textContent);
let huboCambios = false;
let PEDIDO = []; // {codigo, descripcion, precio, cantidad, nota}
let productoModalActual = null;

const $overlayAgregar = document.getElementById('overlayAgregar');
const $modalTitulo = document.getElementById('modalTitulo');
const $modalDesc = document.getElementById('modalDesc');
const $modalFoto = document.getElementById('modalFoto');
const $modalCantidad = document.getElementById('modalCantidad');
const $modalNota = document.getElementById('modalNota');
const $modalCancelar = document.getElementById('modalCancelar');
const $modalAgregar = document.getElementById('modalAgregar');

const $overlayPedido = document.getElementById('overlayPedido');
const $listaPedido = document.getElementById('listaPedido');
const $totalPedido = document.getElementById('totalPedido');
const $btnVaciarPedido = document.getElementById('btnVaciarPedido');
const $btnDescargarPedido = document.getElementById('btnDescargarPedido');
const $btnCerrarPedido = document.getElementById('btnCerrarPedido');
const $btnPedido = document.getElementById('btnPedido');
const $badgePedido = document.getElementById('badgePedido');

const $buscar = document.getElementById('buscar');
const $filtroTipo = document.getElementById('filtroTipo');
const $filtroMarca = document.getElementById('filtroMarca');
const $cuerpoTabla = document.getElementById('cuerpoTabla');
const $contador = document.getElementById('contador');
const $sinResultados = document.getElementById('sinResultados');
const $limpiar = document.getElementById('limpiar');
const $avisoCambios = document.getElementById('avisoCambios');
const $btnDescargar = document.getElementById('btnDescargar');

// poblar selects
const tipos = [...new Set(PRODUCTOS.map(p => p.tipo))].sort((a,b)=>a.localeCompare(b,'es'));
tipos.forEach(t => {
  const o = document.createElement('option');
  o.value = t; o.textContent = t;
  $filtroTipo.appendChild(o);
});
const marcas = [...new Set(PRODUCTOS.flatMap(p => p.marcas))].sort((a,b)=>a.localeCompare(b,'es'));
marcas.forEach(m => {
  const o = document.createElement('option');
  o.value = m; o.textContent = m;
  $filtroMarca.appendChild(o);
});

let ordenCol = null;
let ordenAsc = true;

function normalizar(s) {
  return (s || '').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function filtrar() {
  const q = normalizar($buscar.value.trim());
  const tipo = $filtroTipo.value;
  const marca = $filtroMarca.value;

  let resultado = PRODUCTOS.filter(p => {
    if (tipo && p.tipo !== tipo) return false;
    if (marca && !p.marcas.includes(marca)) return false;
    if (q) {
      const enCodigo = normalizar(p.codigo).includes(q);
      const enDesc = normalizar(p.descripcion).includes(q);
      const enMarca = p.marcas.some(m => normalizar(m).includes(q));
      const enTipo = normalizar(p.tipo).includes(q);
      if (!enCodigo && !enDesc && !enMarca && !enTipo) return false;
    }
    return true;
  });

  if (ordenCol) {
    resultado = resultado.slice().sort((a, b) => {
      let va, vb;
      if (ordenCol === 'precio') {
        const aSinPrecio = a.precio == null;
        const bSinPrecio = b.precio == null;
        if (aSinPrecio && bSinPrecio) return 0;
        if (aSinPrecio) return 1;
        if (bSinPrecio) return -1;
        return ordenAsc ? a.precio - b.precio : b.precio - a.precio;
      }
      if (ordenCol === 'marcas') {
        va = (a.marcas[0] || ''); vb = (b.marcas[0] || '');
      } else {
        va = a[ordenCol] || ''; vb = b[ordenCol] || '';
      }
      return ordenAsc ? va.localeCompare(vb, 'es') : vb.localeCompare(va, 'es');
    });
  }

  render(resultado);
}

function formatoPrecio(p) {
  if (p == null || p.precio == null) {
    if (p && p.precio_usd != null) return 'U$S ' + p.precio_usd.toLocaleString('es-UY');
    return '—';
  }
  return '$ ' + p.precio.toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

// candidatos de foto: prueba el código tal cual y con "/" -> "-", en jpg/jpeg/png
function candidatosFoto(codigo) {
  const variantes = [...new Set([codigo, codigo.replace(/\//g, '-')])];
  const extensiones = ['webp', 'jpg', 'jpeg', 'png'];
  const candidatos = [];
  variantes.forEach(v => extensiones.forEach(ext => candidatos.push(`fotos/${encodeURIComponent(v)}.${ext}`)));
  return candidatos;
}

function crearImagenConFallback(codigo) {
  const candidatos = candidatosFoto(codigo);
  const img = document.createElement('img');
  let i = 0;
  function intentarSiguiente() {
    if (i >= candidatos.length) {
      const div = document.createElement('div');
      div.className = 'sin-foto';
      div.textContent = `Sin foto (poné fotos/${codigo}.jpg)`;
      img.replaceWith(div);
      return;
    }
    img.src = candidatos[i];
    i++;
  }
  img.addEventListener('error', intentarSiguiente);
  intentarSiguiente();
  return img;
}

const LIMITE_RENDER = 300;

function render(listaCompleta) {
  const truncado = listaCompleta.length > LIMITE_RENDER;
  const lista = truncado ? listaCompleta.slice(0, LIMITE_RENDER) : listaCompleta;
  $contador.textContent = listaCompleta.length + ' de ' + PRODUCTOS.length + ' productos'
    + (truncado ? ' (mostrando los primeros ' + LIMITE_RENDER + ' — afiná la búsqueda)' : '');
  $cuerpoTabla.innerHTML = '';
  $sinResultados.style.display = listaCompleta.length === 0 ? 'block' : 'none';

  lista.forEach((p, idx) => {
    const tr = document.createElement('tr');
    tr.className = 'fila-producto';
    if (p._editado) tr.classList.add('editado');
    const marcasHtml = p.marcas.map(m => `<span class="marca-tag">${m}</span>`).join('');
    tr.innerHTML = `
      <td class="codigo">${p.codigo}</td>
      <td class="desc">${p.descripcion}</td>
      <td class="tipo">${p.tipo}</td>
      <td class="marca">${marcasHtml}</td>
      <td class="precio precio-celda">${formatoPrecio(p)}</td>
    `;
    const filaId = 'fila-' + idx;
    tr.addEventListener('click', () => toggleDetalle(filaId));

    const trDetalle = document.createElement('tr');
    trDetalle.className = 'fila-detalle';
    trDetalle.id = filaId;
    trDetalle.dataset.codigo = p.codigo;
    const tdDetalle = document.createElement('td');
    tdDetalle.colSpan = 5;

    const box = document.createElement('div');
    box.className = 'detalle-box';

    const fotoDiv = document.createElement('div');
    fotoDiv.className = 'detalle-foto';
    // la foto se carga recién cuando se abre el detalle (ver toggleDetalle), no acá

    const infoDiv = document.createElement('div');
    infoDiv.className = 'detalle-info';
    infoDiv.innerHTML = `
      <dl>
        <dt>Código</dt><dd>${p.codigo}</dd>
        <dt>Descripción</dt><dd>${p.descripcion}</dd>
        <dt>Tipo</dt><dd>${p.tipo}</dd>
        <dt>Marca</dt><dd>${p.marcas.join(', ') || '—'}</dd>
        <dt>Categoría orig.</dt><dd>${p.categoria_raw || '—'}</dd>
        <dt>Precio</dt><dd></dd>
      </dl>
    `;
    const ddPrecio = infoDiv.querySelector('dl dd:last-child');
    const wrap = document.createElement('div');
    wrap.className = 'precio-edit';
    const inputPrecio = document.createElement('input');
    inputPrecio.type = 'number';
    inputPrecio.step = '0.01';
    inputPrecio.value = p.precio != null ? p.precio : '';
    if (p.precio == null) inputPrecio.placeholder = p.precio_usd != null ? ('USD ' + p.precio_usd) : '';
    const okSpan = document.createElement('span');
    okSpan.className = 'ok';
    okSpan.textContent = 'guardado ✓';
    wrap.appendChild(inputPrecio);
    wrap.appendChild(okSpan);
    ddPrecio.appendChild(wrap);

    function guardarPrecio() {
      const val = parseFloat(inputPrecio.value);
      if (isNaN(val)) return;
      if (val === p.precio) return;
      p.precio = Math.round(val * 100) / 100;
      p._editado = true;
      huboCambios = true;
      $avisoCambios.classList.add('activo');
      okSpan.classList.add('visible');
      tr.classList.add('editado');
      tr.querySelector('.precio-celda').textContent = formatoPrecio(p);
      setTimeout(() => okSpan.classList.remove('visible'), 1500);
    }
    inputPrecio.addEventListener('change', guardarPrecio);
    inputPrecio.addEventListener('click', (e) => e.stopPropagation());
    inputPrecio.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputPrecio.blur(); });

    // click en cualquier parte del detalle (menos el precio editable) abre el popup de agregar al pedido
    box.addEventListener('click', (e) => {
      if (wrap.contains(e.target)) return;
      abrirModalAgregar(p);
    });

    box.appendChild(fotoDiv);
    box.appendChild(infoDiv);
    tdDetalle.appendChild(box);
    trDetalle.appendChild(tdDetalle);

    $cuerpoTabla.appendChild(tr);
    $cuerpoTabla.appendChild(trDetalle);
  });
}

function toggleDetalle(filaId) {
  const el = document.getElementById(filaId);
  const yaAbierta = el.classList.contains('abierta');
  document.querySelectorAll('.fila-detalle.abierta').forEach(e => e.classList.remove('abierta'));
  if (!yaAbierta) {
    el.classList.add('abierta');
    const fotoDiv = el.querySelector('.detalle-foto');
    if (fotoDiv && fotoDiv.childElementCount === 0) {
      fotoDiv.appendChild(crearImagenConFallback(el.dataset.codigo));
    }
  }
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (ordenCol === col) { ordenAsc = !ordenAsc; }
    else { ordenCol = col; ordenAsc = true; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    filtrar();
  });
});

$buscar.addEventListener('input', filtrar);
$filtroTipo.addEventListener('change', filtrar);
$filtroMarca.addEventListener('change', filtrar);
$limpiar.addEventListener('click', () => {
  $buscar.value = '';
  $filtroTipo.value = '';
  $filtroMarca.value = '';
  ordenCol = null;
  document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
  filtrar();
});

// ---- Modal: agregar producto al pedido ----
function abrirModalAgregar(p) {
  productoModalActual = p;
  $modalTitulo.textContent = p.codigo;
  $modalDesc.textContent = p.descripcion;
  $modalFoto.innerHTML = '';
  $modalFoto.appendChild(crearImagenConFallback(p.codigo));
  const existente = PEDIDO.find(i => i.codigo === p.codigo);
  $modalCantidad.value = existente ? existente.cantidad : 1;
  $modalNota.value = existente ? existente.nota : '';
  $overlayAgregar.classList.add('abierto');
  $modalCantidad.focus();
}
$modalCancelar.addEventListener('click', () => $overlayAgregar.classList.remove('abierto'));
$overlayAgregar.addEventListener('click', (e) => { if (e.target === $overlayAgregar) $overlayAgregar.classList.remove('abierto'); });

$modalAgregar.addEventListener('click', () => {
  const p = productoModalActual;
  if (!p) return;
  const cantidad = Math.max(1, parseInt($modalCantidad.value) || 1);
  const nota = $modalNota.value.trim();
  const existente = PEDIDO.find(i => i.codigo === p.codigo);
  if (existente) {
    existente.cantidad = cantidad;
    existente.nota = nota;
  } else {
    PEDIDO.push({ codigo: p.codigo, descripcion: p.descripcion, precio: p.precio, precio_usd: p.precio_usd, cantidad, nota });
  }
  $overlayAgregar.classList.remove('abierto');
  actualizarBadgePedido();
});

// ---- Panel de pedido ----
function actualizarBadgePedido() {
  const totalUnidades = PEDIDO.reduce((s, i) => s + i.cantidad, 0);
  $badgePedido.textContent = totalUnidades;
}

function calcularTotalPedido() {
  return PEDIDO.reduce((s, i) => s + (i.precio != null ? i.precio * i.cantidad : 0), 0);
}

function renderPedido() {
  $listaPedido.innerHTML = '';
  if (PEDIDO.length === 0) {
    $listaPedido.innerHTML = '<div class="pedido-vacio">Todavía no agregaste productos.</div>';
  } else {
    PEDIDO.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'item-pedido';
      const subtotal = item.precio != null ? '$ ' + (item.precio * item.cantidad).toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : (item.precio_usd != null ? 'U$S ' + (item.precio_usd * item.cantidad).toLocaleString('es-UY') : '—');
      div.innerHTML = `
        <div class="item-info">
          <div class="item-codigo">${item.codigo}</div>
          <div class="item-desc">${item.descripcion}</div>
          ${item.nota ? `<div class="item-nota">${item.nota}</div>` : ''}
        </div>
        <div class="item-cant">
          <span>&times;</span>
          <input type="number" min="1" step="1" value="${item.cantidad}">
        </div>
        <div class="item-subtotal">${subtotal}</div>
        <button class="quitar" title="Quitar">✕</button>
      `;
      const inputCant = div.querySelector('.item-cant input');
      inputCant.addEventListener('change', () => {
        const nuevaCant = Math.max(1, parseInt(inputCant.value) || 1);
        item.cantidad = nuevaCant;
        actualizarBadgePedido();
        renderPedido();
      });
      inputCant.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputCant.blur(); });
      div.querySelector('.quitar').addEventListener('click', () => {
        PEDIDO.splice(idx, 1);
        actualizarBadgePedido();
        renderPedido();
      });
      $listaPedido.appendChild(div);
    });
  }
  $totalPedido.textContent = 'Total: $ ' + calcularTotalPedido().toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

$btnPedido.addEventListener('click', () => {
  renderPedido();
  $overlayPedido.classList.add('abierto');
});
$btnCerrarPedido.addEventListener('click', () => $overlayPedido.classList.remove('abierto'));
$overlayPedido.addEventListener('click', (e) => { if (e.target === $overlayPedido) $overlayPedido.classList.remove('abierto'); });

$btnVaciarPedido.addEventListener('click', () => {
  if (PEDIDO.length === 0) return;
  if (!confirm('¿Vaciar todo el pedido?')) return;
  PEDIDO = [];
  actualizarBadgePedido();
  renderPedido();
});

$btnDescargarPedido.addEventListener('click', () => {
  if (PEDIDO.length === 0) return;
  const fecha = new Date().toLocaleString('es-UY');
  let txt = `NOTA DE PEDIDO — ${fecha}\n`;
  txt += '='.repeat(40) + '\n\n';
  PEDIDO.forEach(item => {
    const precioTxt = item.precio != null ? '$ ' + item.precio.toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : (item.precio_usd != null ? 'U$S ' + item.precio_usd : '—');
    const subtotalTxt = item.precio != null ? '$ ' + (item.precio * item.cantidad).toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '—';
    txt += `${item.codigo} x${item.cantidad} — ${item.descripcion}\n`;
    if (item.nota) txt += `  Nota: ${item.nota}\n`;
    txt += `  Precio unit.: ${precioTxt}  Subtotal: ${subtotalTxt}\n\n`;
  });
  txt += '-'.repeat(40) + '\n';
  txt += `TOTAL: $ ${calcularTotalPedido().toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;

  const blob = new Blob([txt], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pedido_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
});

$btnDescargar.addEventListener('click', () => {
  const datosLimpios = PRODUCTOS.map(({_editado, ...resto}) => resto);
  document.getElementById('datos-productos').textContent = JSON.stringify(datosLimpios);
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'buscador.html';
  a.click();
  huboCambios = false;
  $avisoCambios.classList.remove('activo');
});

filtrar();
</script>
